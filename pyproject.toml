[project]
# Distribution name is operator-app; the import package is operator_app (the bare
# name "operator" collides with the Python standard-library module).
name = "operator-app"
version = "0.1.0"
description = "Operator — a Windows desktop agent that drives the real desktop via an LLM screenshot→action loop (provider-agnostic)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "James King", email = "james.s.king@gmail.com" }]
dependencies = [
    "google-genai>=0.3.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.3",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
# Desktop runtime deps. These import cleanly on Windows; some also import on
# Linux (mss, pynput). Kept optional so the cloud phase installs without them.
desktop = [
    "PySide6>=6.6.0",
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pydirectinput>=1.0.4; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
operator = "operator_app.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: tests that require a real Windows desktop (skipped elsewhere)",
]
addopts = "-ra"

[tool.uv]
package = true
